services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf


  passerelle-1:
    build: ./passerelle
    container_name: passerelle-1
    environment:
      - SERVICE=1
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

  passerelle-2:
    build: ./passerelle
    container_name: passerelle-2
    environment:
      - SERVICE=2
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

  passerelle-3:
    build: ./passerelle
    container_name: passerelle-3
    environment:
      - SERVICE=3
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

  passerelle-4:
    build: ./passerelle
    container_name: passerelle-4
    environment:
      - SERVICE=4
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
  simulateur:
    build: ./simulateur
    container_name: simulateur
    environment:
      - MQTT_HOST=mosquitto
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - mosquitto
    restart: unless-stopped
volumes:
  nodered_data: