services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "sante/mosquitto", "-m", "ok"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  passerelle-1:
    build: ./passerelle
    container_name: passerelle-1
    environment:
      - SERVICE=1
      - MQTT_HOST=mosquitto
      - PSEUDO_CLE=${PSEUDO_CLE}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./tampon:/app/tampon
      - ./etat:/app/etat
    

  passerelle-2:
    build: ./passerelle
    container_name: passerelle-2
    environment:
      - SERVICE=1
      - MQTT_HOST=mosquitto
      - PSEUDO_CLE=${PSEUDO_CLE}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./tampon:/app/tampon
      - ./etat:/app/etat
  passerelle-3:
    build: ./passerelle
    container_name: passerelle-3
    environment:
      - SERVICE=1
      - MQTT_HOST=mosquitto
      - PSEUDO_CLE=${PSEUDO_CLE}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./tampon:/app/tampon
      - ./etat:/app/etat
  passerelle-4:
    build: ./passerelle
    container_name: passerelle-4
    environment:
      - SERVICE=1
      - MQTT_HOST=mosquitto
      - PSEUDO_CLE=${PSEUDO_CLE}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./tampon:/app/tampon
      - ./etat:/app/etat
  nodered:
    image: nodered/node-red:5.0.9
    container_name: nodered
    ports:
      - "1880:1880"
    environment:
      - FLOWS=/data/projet/flows.json
    volumes:
      - nodered_data:/data
      - ./nodered:/data/projet
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
  simulateur:
    build: ./simulateur
    container_name: simulateur
    environment:
      - MQTT_HOST=mosquitto
    volumes:
      - ./data:/app/data:ro
      - ./etat:/app/etat
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
volumes:
  nodered_data:
  mosquitto_data:


